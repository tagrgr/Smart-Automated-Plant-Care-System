<!DOCTYPE html>
<html>
<head>
    <title>Smart Home Cloud Pi</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <header class="top-bar">
        <div>
            <h1>Smart Home Cloud Pi</h1>
            <p class="user-label">You are: {{ current_user }}</p>
        </div>

        <a class="logout-link" href="/logout">Logout</a>
    </header>

    <section class="upload-card">
        <h2>Upload File</h2>

        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file">
            <button type="submit">Upload</button>
        </form>
    </section>

    <section class="files-section">
        <h2>Stored Files</h2>

        <div class="file-grid">
            {% for file in files %}
                <div class="file-card">
                    <div class="file-icon">📄</div>

                    <div class="file-name">
                        <a href="/download/{{ file }}">{{ file }}</a>
                    </div>

                    <div class="file-actions-menu">
                        <button class="dots-btn">⋮</button>

                        <div class="dropdown-menu">
                            <a href="/download/{{ file }}">Download</a>
                            <a href="/info/{{ file }}">Info</a>

                            <form action="/copy/{{ file }}" method="post">
                                <button type="submit" class="menu-button">Make a copy</button>
                            </form>

                            <a href="/confirm-delete/{{ file }}" class="delete-link">Delete</a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </section>

</body>
</html>
